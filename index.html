<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plate Poems</title>
<style>
  body { background:#fff; color:#000; font-family:"Times New Roman", Times, serif; margin:8px 16px; }
  h1 { text-align:center; margin:12px 0 4px; }
  .center { text-align:center; }
  #status { color:#555; font-size:14px; }
  #status.err { color:#c00; }
  #poemTitle { text-align:center; font-style:italic; margin:16px 0 8px; }
  #line { white-space:nowrap; overflow-x:auto; text-align:center; padding:8px 0; }
  #line img { height:90px; vertical-align:middle; border:1px solid #000; }
  #line .w { font-size:22px; vertical-align:middle; margin:0 8px; }
  #text { text-align:center; font-size:20px; margin:8px 0 16px; }
  table { border-collapse:collapse; margin:auto; }
  td, th { border:1px solid #999; padding:3px 6px; font-size:14px; }
  td img { height:40px; display:block; }
  input.plate { font-family:"Courier New", monospace; font-weight:bold; width:110px; }
  input.reads { width:200px; }
  .small { font-size:12px; color:#555; }
  tr.rejected td { background:#eee; color:#888; }
  tr.rejected img { opacity:.4; }
</style>
</head>
<body>
<h1>Plate Poems</h1>
<p class="center">
  <button id="readBtn">Check &amp; read photos</button>
  <button id="writeBtn">Write a</button>
  <select id="mode"><option value="poem">poem</option><option value="sentence">sentence</option></select>
  from <input id="count" type="number" min="5" max="12" value="6" style="width:40px"> plates
</p>
<p class="center" id="status">Loading...</p>
<hr>

<div id="poem" style="display:none">
  <div id="poemTitle"></div>
  <div id="line"></div>
  <div id="text"></div>
  <hr>
</div>

<h3 class="center">The plates</h3>
<p class="center small" id="summary"></p>
<p class="center small">Fix any plate or meaning by typing over it. Untick "Use" to leave a plate out, or tick it to keep a rejected one.
  Reader: <input id="readerModel" value="qwen3-vl:8b-instruct" size="18">
  Decoder: <input id="decoderModel" value="gpt-oss:20b" size="12">
  Writer: <input id="writerModel" value="gemma3:12b" size="12"></p>
<table id="table"><tr><th>Use</th><th>Plate</th><th>Says</th><th>What it means</th><th>Status</th><th>Photo</th></tr></table>
<p class="center small"><button id="redoBtn">Work out meanings again</button> <button id="rereadBtn">Re-read every photo</button></p>

<script>
const OLLAMA = 'http://localhost:11434';
const $ = id => document.getElementById(id);
let images = [];          // file names
let plates = {};          // file name -> { plate, state, box, reads }
const crops = {};         // file name -> cropped data URL

function status(msg, err) { $('status').textContent = msg; $('status').className = 'center' + (err ? ' err' : ''); }

async function save() {
  await fetch('/api/save', { method:'POST', body: JSON.stringify(plates, null, 2) });
}

async function init() {
  images = await (await fetch('/api/images')).json();
  try { plates = await (await fetch('/plates.json', { cache:'no-store' })).json(); } catch { plates = {}; }
  await renderTable();
  const todo = images.filter(n => !plates[n] || !plates[n].sha || !isRead(n)).length;
  status(`${images.length} photos found.` + (todo ? ` ${todo} still need checking: press "Check & read photos".` : ' Press "Write" to make something.'));
  try { await fetch(OLLAMA + '/api/tags'); } catch { status('Cannot reach Ollama. Make sure the Ollama app is running.', true); }
}

function loadImage(name) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = encodeURI(name);
  });
}

// Cut the plate out of the photo, using the box Qwen found (0-1000 scale), with a little margin.
async function crop(name) {
  if (crops[name]) return crops[name];
  const img = await loadImage(name);
  const W = img.naturalWidth, H = img.naturalHeight;
  let [x1, y1, x2, y2] = (plates[name] && plates[name].box) || [0, 0, 1000, 1000];
  const padX = (x2 - x1) * 0.06, padY = (y2 - y1) * 0.1;
  x1 = Math.max(0, x1 - padX); y1 = Math.max(0, y1 - padY); x2 = Math.min(1000, x2 + padX); y2 = Math.min(1000, y2 + padY);
  const sx = x1 / 1000 * W, sy = y1 / 1000 * H, sw = (x2 - x1) / 1000 * W, sh = (y2 - y1) / 1000 * H;
  const c = document.createElement('canvas');
  c.height = 180; c.width = Math.max(1, Math.round(180 * sw / sh));
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return crops[name] = c.toDataURL('image/jpeg', 0.9);
}

// Fingerprints for spotting copies before the AI reads anything:
// sha = exact same file, dhash = a 64-bit "what it looks like" hash that survives resizing and recompression.
async function fingerprint(name) {
  const bytes = await (await fetch(encodeURI(name))).arrayBuffer();
  const sha = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))]
    .map(b => b.toString(16).padStart(2, '0')).join('');
  const img = await loadImage(name);
  // Shrink in two steps and average 8x8 blocks by hand: one big jump straight to 9x8 is too noisy to compare.
  const mid = document.createElement('canvas'); mid.width = 288; mid.height = 256;
  const m = mid.getContext('2d'); m.imageSmoothingQuality = 'high';
  m.drawImage(img, 0, 0, 288, 256);
  const c = document.createElement('canvas'); c.width = 72; c.height = 64;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(mid, 0, 0, 72, 64);
  const px = ctx.getImageData(0, 0, 72, 64).data;
  const cell = (cx, cy) => {
    let sum = 0;
    for (let y = cy * 8; y < cy * 8 + 8; y++) for (let x = cx * 8; x < cx * 8 + 8; x++) {
      const i = (y * 72 + x) * 4;
      sum += px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;
    }
    return sum;
  };
  let bits = '';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) bits += cell(x, y) > cell(x + 1, y) ? '1' : '0';
  return { sha, dhash: bits };
}
const hamming = (a, b) => { let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; return d; };
const SIMILAR = 6;   // dhash bits that may differ for two photos to count as the same picture
const norm = s => (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

// Decide which photos to set aside, and why. Runs fresh each time, so fixing a plate re-sorts everything.
function classify() {
  const status = {}, bySha = {}, kept = [], byPlate = {};
  for (const name of images) {
    const p = plates[name] || {};
    if (!p.sha) { status[name] = { ok:true, why:'not checked yet' }; continue; }
    if (bySha[p.sha]) { status[name] = { ok:false, why:`exact copy of ${bySha[p.sha]}` }; continue; }
    bySha[p.sha] = name;
    const twin = kept.find(k => hamming(plates[k].dhash, p.dhash) <= SIMILAR);
    if (twin) { status[name] = { ok:false, why:`near copy of ${twin}` }; continue; }
    kept.push(name);
    if (!('hasPlate' in p) && !p.box) { status[name] = { ok:true, why:'not read yet' }; continue; }
    if (p.hasPlate === false || !norm(p.plate)) { status[name] = { ok:false, why:'no plate found' }; continue; }
    if (p.vanity === false) { status[name] = { ok:false, why:'ordinary plate (not personalized)' }; continue; }
    (byPlate[norm(p.plate)] ||= []).push(name);
    status[name] = { ok:true, why:'' };
  }
  // Same plate in several photos: keep the one where the plate is biggest (usually the clearest).
  const area = n => { const b = plates[n].box; return b ? (b[2] - b[0]) * (b[3] - b[1]) : 0; };
  for (const group of Object.values(byPlate)) {
    if (group.length < 2) continue;
    const best = group.reduce((a, b) => area(b) > area(a) ? b : a);
    group.filter(n => n !== best).forEach(n => status[n] = { ok:false, why:`same plate as ${best}` });
  }
  // A tick or untick in the "Use" column overrides the automatic choice.
  for (const name of images) {
    const s = status[name], use = plates[name] && plates[name].use;
    s.use = use === undefined ? s.ok : use;
  }
  return status;
}
const usable = () => { const s = classify(); return images.filter(n => s[n].use && plates[n] && plates[n].plate); };

async function renderTable() {
  const table = $('table');
  while (table.rows.length > 1) table.deleteRow(1);
  const status = classify();
  const counts = {};
  for (const name of images) {
    const p = plates[name] || {};
    const s = status[name];
    const row = table.insertRow();
    row.id = 'row-' + name;
    row.className = s.use ? '' : 'rejected';
    row.innerHTML = `<td><input type="checkbox" class="use"></td><td><img></td><td><input class="plate"></td>` +
      `<td><input class="reads"></td><td class="small"></td><td class="small"></td>`;
    if (p.sha) row.querySelector('img').src = await crop(name).catch(() => '');  // whole photo when there's no plate box
    row.querySelector('.use').checked = s.use;
    row.querySelector('.plate').value = p.plate || '';
    row.querySelector('.reads').value = p.reads || '';
    row.cells[4].textContent = s.why + (s.use !== s.ok ? (s.use ? ' (kept anyway)' : ' (left out)') : '');
    row.cells[5].textContent = name;
    const key = s.ok ? (s.why || 'ok') : s.why.replace(/ of .*| as .*/, '');
    counts[key] = (counts[key] || 0) + 1;
    row.querySelector('.use').onchange = e => {
      if (!plates[name]) return;
      plates[name].use = e.target.checked === s.ok ? undefined : e.target.checked;
      save(); renderTable();
    };
    row.querySelector('.plate').onchange = e => {
      plates[name] = { ...p, plate: e.target.value.trim().toUpperCase(), hasPlate: !!e.target.value.trim(), checked: true, reads: undefined };
      save(); renderTable();
    };
    row.querySelector('.reads').onchange = e => {
      if (!plates[name]) return;
      plates[name].reads = e.target.value.trim() || undefined;
      plates[name].readsEdited = !!plates[name].reads;
      save();
    };
  }
  const using = images.filter(n => status[n].use).length;
  $('summary').textContent = `${images.length} photos: using ${using}. ` +
    Object.entries(counts).filter(([k]) => k !== 'ok').map(([k, v]) => `${v} ${k}`).join(', ');
}

// Shrink a photo to a JPEG the vision model can handle quickly.
async function shrink(name, max = 1280) {
  const img = await loadImage(name);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9).split(',')[1];
}

async function ollamaJSON(model, messages, schema, options, extra) {
  const r = await fetch(OLLAMA + '/api/chat', {
    method:'POST',
    body: JSON.stringify({ model, messages, format: schema, stream:false, options, ...extra })
  });
  if (!r.ok) throw new Error(`${model}: ${(await r.text()).slice(0, 300)}`);
  const data = await r.json();
  return JSON.parse(data.message.content);
}

const plateSchema = {
  type:'object',
  properties: { has_plate:{type:'boolean'}, plate:{type:'string'}, state:{type:'string'}, box:{type:'array', items:{type:'number'}} },
  required:['has_plate','plate','state','box']
};
const isRead = n => plates[n] && (plates[n].read || plates[n].box);

// A close-up of just the plate, enlarged, for a second, more careful read.
async function plateCloseup(name) {
  const img = await loadImage(name);
  const W = img.naturalWidth, H = img.naturalHeight;
  let [x1, y1, x2, y2] = plates[name].box;
  const padX = (x2 - x1) * 0.15, padY = (y2 - y1) * 0.3;
  x1 = Math.max(0, x1 - padX); y1 = Math.max(0, y1 - padY); x2 = Math.min(1000, x2 + padX); y2 = Math.min(1000, y2 + padY);
  const sx = x1 / 1000 * W, sy = y1 / 1000 * H, sw = (x2 - x1) / 1000 * W, sh = (y2 - y1) / 1000 * H;
  const s = Math.min(1024 / sw, 4);
  const c = document.createElement('canvas');
  c.width = Math.round(sw * s); c.height = Math.round(sh * s);
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.92).split(',')[1];
}

// Second opinion: read the plate again from the close-up. If the two reads disagree, show Qwen both and have it
// compare them character by character against the close-up. In testing this roughly halved the misreads.
async function doubleCheck(name) {
  const p = plates[name];
  if (p.hasPlate && p.box) {
    const closeup = await plateCloseup(name);
    const second = (await ollamaJSON($('readerModel').value, [{
      role:'user',
      content:'This is a close-up of a vehicle license plate. Read the large main characters of the plate exactly as written, ' +
        'character by character (letters, numbers, and any spaces, dashes, dots, stars or heart symbols that are part of it). ' +
        'Be careful with look-alike characters: 0/O/D/Q, 1/I/L/J, 5/S, 8/B, 2/Z, 6/G, M/N/W, U/V. ' +
        'Ignore the state name, slogans, frames and stickers.',
      images:[closeup]
    }], { type:'object', properties:{ plate:{type:'string'} }, required:['plate'] }, { temperature:0 })).plate.trim().toUpperCase();
    if (norm(second) !== norm(p.plate)) {
      const out = await ollamaJSON($('readerModel').value, [{
        role:'user',
        content:`This is a close-up of a vehicle license plate. Two earlier readings of it disagree:\nA: ${p.plate}\nB: ${second}\n` +
          'Look carefully at the plate and compare the readings character by character in "comparison" (keep it short). ' +
          'Then give "plate": the exact characters on the plate. It may be A, B, or a correction of either. ' +
          'Ignore the state name, slogans, frames, and stickers.',
        images:[closeup]
      }], { type:'object', properties:{ comparison:{type:'string'}, plate:{type:'string'} }, required:['comparison','plate'] },
        { temperature:0, num_predict:400 });
      let final = out.plate.trim().toUpperCase();
      if (final === 'A') final = p.plate;
      if (final === 'B') final = second;
      p.firstRead = p.plate;
      if (final && final !== p.plate) { p.plate = final; p.reads = undefined; }
    }
  }
  p.checked = true;
  await save();
}

// Step 1: fingerprint every photo so exact and near copies are set aside before the AI spends time on them,
// then Qwen reads the text off each remaining plate and says where the plate is in the photo.
async function readPlates(all) {
  setBusy(true);
  const unchecked = images.filter(n => !plates[n] || !plates[n].sha);
  let i = 0;
  for (const name of unchecked) {
    if (++i % 10 === 1) status(`Checking photos for copies: ${i} of ${unchecked.length}...`);
    try { plates[name] = { ...(plates[name] || {}), ...await fingerprint(name) }; }
    catch (e) { plates[name] = { ...(plates[name] || {}), sha: 'unreadable-' + name, dhash: '', hasPlate: false, read: true }; }
  }
  if (unchecked.length) await save();
  const status0 = classify();
  const needsCheck = n => plates[n].hasPlate !== false && !plates[n].checked;
  const todo = images.filter(n => !/copy/.test(status0[n].why) && (all || !isRead(n) || needsCheck(n)));
  if (!todo.length) { setBusy(false); await renderTable(); return status('Every photo is already checked and read.'); }
  i = 0;
  for (const name of todo) {
    i++;
    status(`Reading plate ${i} of ${todo.length} (${name})... The first one is slow while the model loads.`);
    try {
      if (!all && isRead(name)) { await doubleCheck(name); continue; }
      const out = await ollamaJSON($('readerModel').value, [{
        role:'user',
        content:'First decide whether this photo shows a real vehicle license plate you can read (has_plate). ' +
          'Screenshots, memes, chat images, people, food, scenery, and photos where no plate is readable are has_plate false. ' +
          'If there is a plate (probably a personalized vanity plate), read its large main characters exactly as written ' +
          '(letters, numbers, and any spaces or symbols that are part of it). ' +
          'Ignore the state name, slogans, dealer frames, and registration stickers. ' +
          'Give the state or country if you can tell, otherwise an empty string. ' +
          'Give the bounding box of the whole plate as [x1, y1, x2, y2] in coordinates from 0 to 1000 relative to the image width and height. ' +
          'If has_plate is false, return an empty plate and [0, 0, 0, 0].',
        images:[await shrink(name)]
      }], plateSchema, { temperature:0 });
      const old = plates[name] || {};
      const plate = (out.plate || '').trim().toUpperCase();
      const box = out.box && out.box.length === 4 && out.box[2] > out.box[0] && out.box[3] > out.box[1] ? out.box : null;
      plates[name] = { ...old, plate, state: out.state, box, read: true, hasPlate: !!out.has_plate && !!plate,
        checked: false, reads: old.plate === plate ? old.reads : undefined };
      delete crops[name];
      await doubleCheck(name);
    } catch (e) {
      status(`Problem reading ${name}: ${e.message}`, true);
      setBusy(false); return renderTable();
    }
  }
  await renderTable();
  setBusy(false);
  status(`Done. Read ${todo.length} photos. ${$('summary').textContent} Check them over below, then press "Write".`);
}

const decodeSchema = {
  type:'object',
  properties: { readings:{ type:'array', items:{ type:'object',
    properties:{ plate:{type:'string'}, is_vanity:{type:'boolean'}, reads_as:{type:'string'} },
    required:['plate','is_vanity','reads_as'] } } },
  required:['readings']
};

// The examples here are deliberately NOT plates from the photo set, so testing against real plates stays fair.
const DECODE_RULES = `For each plate, work out what the owner meant. Personalized (vanity) plates squeeze a word, phrase, joke, or reference into 7 or 8 characters, so they need decoding like a puzzle.

How to decode:
- Sound it out loud. Letters and numbers stand for sounds: U = you, R = are, C = see, B = be, Y = why, I = I or eye, O = oh, N = and, Q = queue, X = cross or ex, Z = s or z at the end of a word, 2 = to/too, 4 = for, 8 = ate (GR8 = great, H8 = hate, L8R = later), 1 = one/won, 0 = o, 3 = e, 5 = s, 7 = t.
- Vowels are often dropped (SKL TCHR = school teacher). A single letter can stand for a whole word (V = very, M = my or me, N = and).
- Spaces, dashes, dots and stars just split words. A heart symbol means love.
- Think about pop culture, internet memes and slang (OK BOOMR = "ok boomer", RIZZLER, SKIBIDI), music genres, Bible verses (JOHN 316), sports teams and schools (HOOK EM = Texas Longhorns, a number before a school is a class year), brands, and Spanish (MI CASA).
- Think about car culture: car models and trims (GT, SRT, AMG, 911), a two-digit number after a word is often the car's model year, EVs (NO GAS), JDM, lowriders.
- ATX = Austin, Texas. HTX = Houston. DTX = Dallas.
- Ordinary state-issued plates are random letters and numbers with no meaning (like ABC-1234 or KLM 5521). Mark those is_vanity false.

Sound each one out and consider the options before answering. Give "reads_as": the meaning in plain words as the owner intended, short and natural, like you'd say it out loud (for example "school teacher", "ok boomer", "great day"). Use the actual words, not a description of them.`;

// Step 2: work out what each plate means in plain words, once, and remember it. Ten at a time keeps the
// model's attention on each plate. Ordinary state-issued plates get flagged so they stay out of poems.
async function decodePlates(pool) {
  const all = [...new Set(pool.filter(n => !plates[n].reads).map(n => plates[n].plate))];
  for (let start = 0; start < all.length; start += 10) {
    const todo = all.slice(start, start + 10);
    status(`Working out what the plates mean: ${start + todo.length} of ${all.length}...`);
    const model = $('decoderModel').value;
    const ask = () => ollamaJSON(model, [{
      role:'user',
      content:`Here are ${todo.length} license plates photographed in the US (mostly Texas):\n${todo.join('\n')}\n\n` +
        DECODE_RULES + `\n\nReturn "readings" with one entry per plate, in the same order, with "plate" copied exactly.`
    }], decodeSchema,
      // gpt-oss thinks before answering and needs its normal temperature: at 0 it loops and runs out of room.
      /gpt-oss/.test(model) ? { temperature:1, num_ctx:16384 } : { temperature:0, num_ctx:8192 },
      /gpt-oss/.test(model) ? { think:'medium' } : {});
    let out;
    try { out = await ask(); } catch (e) { out = await ask(); }  // one retry if the answer came back cut off
    out.readings.forEach((r, i) => {
      // Match by text, falling back to position in case the model retyped the plate slightly differently.
      const key = norm(r.plate);
      const plate = todo.find(t => norm(t) === key) || todo[i];
      pool.filter(n => plates[n].plate === plate).forEach(n => {
        plates[n].reads = r.reads_as;
        plates[n].vanity = r.is_vanity;
      });
    });
    await save();
  }
  if (all.length) await renderTable();
}

const storySchema = {
  type:'object',
  properties: {
    title:{type:'string'},
    plates:{ type:'array', items:{ type:'object',
      properties:{ words_before:{type:'string'}, plate:{type:'string'} },
      required:['words_before','plate'] } }
  },
  required:['title','plates']
};

// Step 3: Gemma picks plates and puts them in order, with at most 2 small words between them.
async function write() {
  let pool = usable();
  const count = Math.max(5, +$('count').value || 6);
  if (pool.length < 5) return status('Need at least 5 usable plates first. Press "Check & read photos".', true);
  setBusy(true);
  try {
    await decodePlates(pool);
    pool = usable().filter(n => plates[n].reads);  // decoding may have flagged some as ordinary plates
    status('Arranging plates...');
    // One entry per distinct plate, shuffled so each run gets a different mix to choose from.
    // Capped at 80 so a big photo set still fits in what the model can take in at once.
    const list = [...new Map(pool.map(n => [plates[n].plate, plates[n].reads])).entries()]
      .sort(() => Math.random() - 0.5).slice(0, 80).map(([p, r]) => `${p} = "${r}"`);
    const mode = $('mode').value;
    const out = await ollamaJSON($('writerModel').value, [{
      role:'user',
      content:`These are real personalized license plates people photographed, with what each one says:\n${list.join('\n')}\n\n` +
        `Make ${mode === 'poem' ? 'a short poem' : 'one sentence'} out of these plates, shown in a row like magnetic poetry. ` +
        `Pick exactly ${count} different plates and put them in order. The plates do most of the talking: ` +
        `before each plate you may put "words_before", at most 2 small connecting words (like "and", "the", "to", "of my", "but"), ` +
        `or an empty string. Use connecting words only where they really help; most plates should have none. ` +
        `Read straight through (connecting words plus each plate's meaning), it should make a ${mode} that makes sense. ` +
        `Give "plate" copied exactly from the list, and a short "title". Be playful and clever.`
    }], storySchema, { temperature:0.9 });
    // Match each chosen plate back to a photo, and hold Gemma to 2 connecting words.
    const used = new Set();
    const picks = out.plates.map(p => {
      const key = p.plate.trim().toUpperCase();
      const file = pool.find(n => !used.has(n) && plates[n].plate === key)
        || pool.find(n => !used.has(n) && plates[n].plate.replace(/\W/g,'') === key.replace(/\W/g,''));
      if (file) used.add(file);
      return { file, words: (p.words_before || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).join(' ') };
    }).filter(p => p.file);
    if (picks.length < 5) throw new Error(`The writer only used ${picks.length} real plates from the list. Try again.`);
    await showPoem(out.title, picks);
    status(`Made a ${mode} from ${picks.length} plates. Press "Write" again for a different one.`);
  } catch (e) {
    status('Problem writing: ' + e.message, true);
  }
  setBusy(false);
}

async function showPoem(title, picks) {
  $('poem').style.display = 'block';
  $('poemTitle').textContent = title;
  $('line').innerHTML = '';
  for (const p of picks) {
    if (p.words) {
      const w = document.createElement('span'); w.className = 'w'; w.textContent = p.words;
      $('line').appendChild(w);
    }
    const img = document.createElement('img');
    img.src = await crop(p.file);
    img.title = `${plates[p.file].plate}: ${plates[p.file].reads}`;
    $('line').appendChild(img);
    $('line').appendChild(document.createTextNode(' '));
  }
  $('text').textContent = picks.map(p => (p.words ? p.words + ' ' : '') + plates[p.file].reads).join(' ');
}

function setBusy(b) { ['readBtn','rereadBtn','redoBtn','writeBtn'].forEach(id => $(id).disabled = b); }

// Throw away the decoded meanings (except ones typed in by hand) and work them all out again.
async function redoMeanings() {
  for (const n of images) if (plates[n] && !plates[n].readsEdited) { delete plates[n].reads; delete plates[n].vanity; }
  setBusy(true);
  try {
    // Decode everything that has a plate, so ordinary plates can be flagged before poems are written.
    await decodePlates(images.filter(n => plates[n] && plates[n].hasPlate !== false && plates[n].plate));
    status(`Done. ${$('summary').textContent}`);
  } catch (e) { status('Problem working out meanings: ' + e.message, true); }
  setBusy(false);
}

$('readBtn').onclick = () => readPlates(false);
$('rereadBtn').onclick = () => { if (confirm('Read every photo again from scratch?')) readPlates(true); };
$('writeBtn').onclick = write;
$('redoBtn').onclick = () => { if (confirm('Work out every meaning again? Meanings you typed in yourself are kept.')) redoMeanings(); };
init();
</script>
