<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plate Poems</title>
<style>
  body { background:#fff; color:#000; font-family:"Times New Roman", Times, serif; margin:8px 16px; }
  h1 { text-align:center; margin:12px 0 4px; }
  .center { text-align:center; }
  #status { color:#555; font-size:14px; }
  #status.err { color:#c00; }
  #poemTitle { text-align:center; font-style:italic; margin:16px 0 8px; }
  #line { white-space:nowrap; overflow-x:auto; text-align:center; padding:8px 0; }
  #line img { height:90px; vertical-align:middle; border:1px solid #000; }
  #line .w { font-size:22px; vertical-align:middle; margin:0 8px; }
  #text { text-align:center; font-size:20px; margin:8px 0 16px; }
  table { border-collapse:collapse; margin:auto; }
  td, th { border:1px solid #999; padding:3px 6px; font-size:14px; }
  td img { height:40px; display:block; }
  input.plate { font-family:"Courier New", monospace; font-weight:bold; width:110px; }
  input.reads { width:200px; }
  .small { font-size:12px; color:#555; }
</style>
</head>
<body>
<h1>Plate Poems</h1>
<p class="center">
  <button id="readBtn">Read plates</button>
  <button id="writeBtn">Write a</button>
  <select id="mode"><option value="poem">poem</option><option value="sentence">sentence</option></select>
  from <input id="count" type="number" min="5" max="12" value="6" style="width:40px"> plates
</p>
<p class="center" id="status">Loading...</p>
<hr>

<div id="poem" style="display:none">
  <div id="poemTitle"></div>
  <div id="line"></div>
  <div id="text"></div>
  <hr>
</div>

<h3 class="center">The plates</h3>
<p class="center small">Fix any plate or meaning by typing over it.
  Reader: <input id="readerModel" value="qwen3-vl:8b-instruct" size="18">
  Writer: <input id="writerModel" value="gemma3:12b" size="12"></p>
<table id="table"><tr><th>Plate</th><th>Says</th><th>What it means</th><th>Photo</th></tr></table>
<p class="center small"><button id="rereadBtn">Re-read every photo</button></p>

<script>
const OLLAMA = 'http://localhost:11434';
const $ = id => document.getElementById(id);
let images = [];          // file names
let plates = {};          // file name -> { plate, state, box, reads }
const crops = {};         // file name -> cropped data URL

function status(msg, err) { $('status').textContent = msg; $('status').className = 'center' + (err ? ' err' : ''); }

async function save() {
  await fetch('/api/save', { method:'POST', body: JSON.stringify(plates, null, 2) });
}

async function init() {
  images = await (await fetch('/api/images')).json();
  try { plates = await (await fetch('/plates.json', { cache:'no-store' })).json(); } catch { plates = {}; }
  await renderTable();
  const todo = images.filter(n => !plates[n] || !plates[n].box).length;
  status(`${images.length} photos found.` + (todo ? ` ${todo} still need reading: press "Read plates".` : ' Press "Write" to make something.'));
  try { await fetch(OLLAMA + '/api/tags'); } catch { status('Cannot reach Ollama. Make sure the Ollama app is running.', true); }
}

function loadImage(name) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = encodeURI(name);
  });
}

// Cut the plate out of the photo, using the box Qwen found (0-1000 scale), with a little margin.
async function crop(name) {
  if (crops[name]) return crops[name];
  const img = await loadImage(name);
  const W = img.naturalWidth, H = img.naturalHeight;
  let [x1, y1, x2, y2] = (plates[name] && plates[name].box) || [0, 0, 1000, 1000];
  const padX = (x2 - x1) * 0.06, padY = (y2 - y1) * 0.1;
  x1 = Math.max(0, x1 - padX); y1 = Math.max(0, y1 - padY); x2 = Math.min(1000, x2 + padX); y2 = Math.min(1000, y2 + padY);
  const sx = x1 / 1000 * W, sy = y1 / 1000 * H, sw = (x2 - x1) / 1000 * W, sh = (y2 - y1) / 1000 * H;
  const c = document.createElement('canvas');
  c.height = 180; c.width = Math.max(1, Math.round(180 * sw / sh));
  c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return crops[name] = c.toDataURL('image/jpeg', 0.9);
}

async function renderTable() {
  const table = $('table');
  while (table.rows.length > 1) table.deleteRow(1);
  for (const name of images) {
    const p = plates[name] || {};
    const row = table.insertRow();
    row.id = 'row-' + name;
    row.innerHTML = `<td><img></td><td><input class="plate"></td><td><input class="reads"></td><td class="small"></td>`;
    if (p.box) row.querySelector('img').src = await crop(name);
    row.querySelector('.plate').value = p.plate || '';
    row.querySelector('.reads').value = p.reads || '';
    row.cells[3].textContent = name;
    row.querySelector('.plate').onchange = e => {
      plates[name] = { ...p, plate: e.target.value.trim().toUpperCase(), reads: undefined };
      row.querySelector('.reads').value = '';
      save();
    };
    row.querySelector('.reads').onchange = e => {
      if (!plates[name]) return;
      plates[name].reads = e.target.value.trim() || undefined;
      save();
    };
  }
}

// Shrink a photo to a JPEG the vision model can handle quickly.
async function shrink(name, max = 1280) {
  const img = await loadImage(name);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.9).split(',')[1];
}

async function ollamaJSON(model, messages, schema, options) {
  const r = await fetch(OLLAMA + '/api/chat', {
    method:'POST',
    body: JSON.stringify({ model, messages, format: schema, stream:false, options })
  });
  if (!r.ok) throw new Error(`${model}: ${(await r.text()).slice(0, 300)}`);
  const data = await r.json();
  return JSON.parse(data.message.content);
}

const plateSchema = {
  type:'object',
  properties: { plate:{type:'string'}, state:{type:'string'}, box:{type:'array', items:{type:'number'}} },
  required:['plate','state','box']
};

// Step 1: Qwen reads the text off each plate and says where the plate is in the photo.
async function readPlates(all) {
  const todo = images.filter(n => all || !plates[n] || !plates[n].box);
  if (!todo.length) return status('Every photo is already read.');
  setBusy(true);
  let i = 0;
  for (const name of todo) {
    i++;
    status(`Reading plate ${i} of ${todo.length} (${name})... The first one is slow while the model loads.`);
    try {
      const out = await ollamaJSON($('readerModel').value, [{
        role:'user',
        content:'This photo shows a car license plate, probably a personalized vanity plate. ' +
          'Read the large main characters of the plate exactly as written (letters, numbers, and any spaces or symbols that are part of it). ' +
          'Ignore the state name, slogans, dealer frames, and registration stickers. ' +
          'Give the state or country if you can tell, otherwise an empty string. ' +
          'Give the bounding box of the whole plate as [x1, y1, x2, y2] in coordinates from 0 to 1000 relative to the image width and height. ' +
          'If there is no readable plate, return an empty plate.',
        images:[await shrink(name)]
      }], plateSchema, { temperature:0 });
      const old = plates[name] || {};
      const plate = (out.plate || '').trim().toUpperCase();
      const box = out.box && out.box.length === 4 && out.box[2] > out.box[0] && out.box[3] > out.box[1] ? out.box : null;
      plates[name] = { plate, state: out.state, box, reads: old.plate === plate ? old.reads : undefined };
      delete crops[name];
      await save();
    } catch (e) {
      status(`Problem reading ${name}: ${e.message}`, true);
      setBusy(false); return renderTable();
    }
  }
  await renderTable();
  setBusy(false);
  status(`Done. Read ${todo.length} plates. Check them over below, then press "Write".`);
}

const decodeSchema = {
  type:'object',
  properties: { readings:{ type:'array', items:{ type:'object',
    properties:{ plate:{type:'string'}, reads_as:{type:'string'} }, required:['plate','reads_as'] } } },
  required:['readings']
};

// Step 2: Gemma works out what each plate says in plain words, once, and we remember it.
async function decodePlates(pool) {
  const todo = [...new Set(pool.filter(n => !plates[n].reads).map(n => plates[n].plate))];
  if (!todo.length) return;
  status(`Working out what ${todo.length} plates say...`);
  const out = await ollamaJSON($('writerModel').value, [{
    role:'user',
    content:`Here are ${todo.length} personalized (vanity) license plates:\n${todo.join('\n')}\n\n` +
      `Decode each one into the plain words it spells. Vanity plates squeeze words into 7 or 8 characters ` +
      `(GR8 = great, 4 = for, U = you, 2 = to, ♥ = love or heart, missing vowels, and so on). ` +
      `Give only the words the plate spells, nothing extra. If it is a name or you cannot tell, give your best guess. ` +
      `Return "readings" with one entry for every one of the ${todo.length} plates, with "plate" copied exactly.`
  }], decodeSchema, { temperature:0 });
  if (!out.readings.length) throw new Error('The writer did not decode any plates. Try again.');
  for (const r of out.readings) {
    const key = r.plate.trim().toUpperCase();
    pool.filter(n => plates[n].plate === key).forEach(n => plates[n].reads = r.reads_as);
  }
  await save();
  await renderTable();
}

const storySchema = {
  type:'object',
  properties: {
    title:{type:'string'},
    plates:{ type:'array', items:{ type:'object',
      properties:{ words_before:{type:'string'}, plate:{type:'string'} },
      required:['words_before','plate'] } }
  },
  required:['title','plates']
};

// Step 3: Gemma picks plates and puts them in order, with at most 2 small words between them.
async function write() {
  let pool = images.filter(n => plates[n] && plates[n].plate);
  const count = Math.max(5, +$('count').value || 6);
  if (pool.length < 5) return status('Need at least 5 read plates first.', true);
  setBusy(true);
  try {
    await decodePlates(pool);
    pool = pool.filter(n => plates[n].reads);
    status('Arranging plates...');
    // One entry per distinct plate, shuffled so each run gets a different mix to choose from.
    const list = [...new Map(pool.map(n => [plates[n].plate, plates[n].reads])).entries()]
      .sort(() => Math.random() - 0.5).map(([p, r]) => `${p} = "${r}"`);
    const mode = $('mode').value;
    const out = await ollamaJSON($('writerModel').value, [{
      role:'user',
      content:`These are real personalized license plates people photographed, with what each one says:\n${list.join('\n')}\n\n` +
        `Make ${mode === 'poem' ? 'a short poem' : 'one sentence'} out of these plates, shown in a row like magnetic poetry. ` +
        `Pick exactly ${count} different plates and put them in order. The plates do most of the talking: ` +
        `before each plate you may put "words_before", at most 2 small connecting words (like "and", "the", "to", "of my", "but"), ` +
        `or an empty string. Use connecting words only where they really help; most plates should have none. ` +
        `Read straight through (connecting words plus each plate's meaning), it should make a ${mode} that makes sense. ` +
        `Give "plate" copied exactly from the list, and a short "title". Be playful and clever.`
    }], storySchema, { temperature:0.9 });
    // Match each chosen plate back to a photo, and hold Gemma to 2 connecting words.
    const used = new Set();
    const picks = out.plates.map(p => {
      const key = p.plate.trim().toUpperCase();
      const file = pool.find(n => !used.has(n) && plates[n].plate === key)
        || pool.find(n => !used.has(n) && plates[n].plate.replace(/\W/g,'') === key.replace(/\W/g,''));
      if (file) used.add(file);
      return { file, words: (p.words_before || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).join(' ') };
    }).filter(p => p.file);
    if (picks.length < 5) throw new Error(`The writer only used ${picks.length} real plates from the list. Try again.`);
    await showPoem(out.title, picks);
    status(`Made a ${mode} from ${picks.length} plates. Press "Write" again for a different one.`);
  } catch (e) {
    status('Problem writing: ' + e.message, true);
  }
  setBusy(false);
}

async function showPoem(title, picks) {
  $('poem').style.display = 'block';
  $('poemTitle').textContent = title;
  $('line').innerHTML = '';
  for (const p of picks) {
    if (p.words) {
      const w = document.createElement('span'); w.className = 'w'; w.textContent = p.words;
      $('line').appendChild(w);
    }
    const img = document.createElement('img');
    img.src = await crop(p.file);
    img.title = `${plates[p.file].plate}: ${plates[p.file].reads}`;
    $('line').appendChild(img);
    $('line').appendChild(document.createTextNode(' '));
  }
  $('text').textContent = picks.map(p => (p.words ? p.words + ' ' : '') + plates[p.file].reads).join(' ');
}

function setBusy(b) { ['readBtn','rereadBtn','writeBtn'].forEach(id => $(id).disabled = b); }

$('readBtn').onclick = () => readPlates(false);
$('rereadBtn').onclick = () => { if (confirm('Read every photo again from scratch?')) readPlates(true); };
$('writeBtn').onclick = write;
init();
</script>
</body>
</html>
